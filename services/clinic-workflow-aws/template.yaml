AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClinicPluz synthetic staging reception workflow API (no real patient data)

Parameters:
  StageName:
    Type: String
    Default: staging
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
  PublicOrigin:
    Type: String
    Description: Exact CloudFront distribution origin that hosts the Clinic App
    AllowedPattern: 'https://[a-z0-9-]+\.cloudfront\.net'
  AuthTableName:
    Type: String
    Description: AuthTableName output from clinic-auth-aws
  StaffUserPoolId:
    Type: String
    Description: UserPoolId output from clinic-auth-aws
  StaffUserPoolArn:
    Type: String
    Description: ARN of the same clinic staff user pool
  EnablePrescriptionDemoEmail:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Explicitly enable synthetic prescription PDF email only in staging
  PrescriptionSenderEmail:
    Type: String
    Default: ''
    AllowedPattern: '(^$)|(^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$)'
    Description: SES-verified sender address in this stack's Region when demo email is enabled
  PrescriptionAllowedRecipientEmail:
    Type: String
    Default: ''
    AllowedPattern: '(^$)|(^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,63}$)'
    Description: One SES-verified synthetic recipient; must match the stored patient email

Rules:
  ValidPrescriptionDemoEmailConfiguration:
    RuleCondition: !Equals [!Ref EnablePrescriptionDemoEmail, 'true']
    Assertions:
      - Assert: !Equals [!Ref StageName, staging]
        AssertDescription: Synthetic prescription email can only be enabled in staging.
      - Assert: !Not [!Equals [!Ref PrescriptionSenderEmail, '']]
        AssertDescription: A sender address is required when synthetic prescription email is enabled.
      - Assert: !Not [!Equals [!Ref PrescriptionAllowedRecipientEmail, '']]
        AssertDescription: A synthetic recipient is required when prescription email is enabled.

Conditions:
  PrescriptionEmailEnabled: !And
    - !Equals [!Ref StageName, staging]
    - !Equals [!Ref EnablePrescriptionDemoEmail, 'true']

Resources:
  WorkflowEdgeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Random CloudFront-to-workflow origin-only header value
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  ClinicalTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub clinicpluz-${StageName}-clinical
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WorkflowApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clinicpluz-${StageName}-workflow
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          AUTH_TABLE: !Ref AuthTableName
          CLINICAL_TABLE: !Ref ClinicalTable
          STAFF_USER_POOL_ID: !Ref StaffUserPoolId
          PUBLIC_ORIGIN: !Ref PublicOrigin
          EDGE_SECRET_ARN: !Ref WorkflowEdgeSecret
          STAGE_NAME: !Ref StageName
          PRESCRIPTION_EMAIL_ENABLED: !If [PrescriptionEmailEnabled, 'true', 'false']
          PRESCRIPTION_EMAIL_SENDER: !Ref PrescriptionSenderEmail
          PRESCRIPTION_EMAIL_ALLOWED_RECIPIENT: !Ref PrescriptionAllowedRecipientEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthTableName}
              Condition:
                'ForAllValues:StringLike':
                  'dynamodb:LeadingKeys': ['SESSION#*', 'CLINIC#*']
                'Null':
                  'dynamodb:LeadingKeys': 'false'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt ClinicalTable.Arn
              Condition:
                'ForAllValues:StringLike':
                  'dynamodb:LeadingKeys': ['CLINIC#*']
                'Null':
                  'dynamodb:LeadingKeys': 'false'
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Ref StaffUserPoolArn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref WorkflowEdgeSecret
        - !If
          - PrescriptionEmailEnabled
          - Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${PrescriptionSenderEmail}
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref PrescriptionSenderEmail
                  ForAllValues:StringEquals:
                    ses:Recipients: [!Ref PrescriptionAllowedRecipientEmail]
                  'Null':
                    ses:Recipients: 'false'
          - !Ref AWS::NoValue
      Events:
        Doctors:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/doctors', Method: GET, PayloadFormatVersion: '2.0' }
        SearchPatients:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/patients/search', Method: POST, PayloadFormatVersion: '2.0' }
        RegisterPatient:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/patients', Method: POST, PayloadFormatVersion: '2.0' }
        ListAppointments:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/appointments', Method: GET, PayloadFormatVersion: '2.0' }
        BookAppointment:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/appointments', Method: POST, PayloadFormatVersion: '2.0' }
        CheckInAppointment:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/appointments/check-in', Method: POST, PayloadFormatVersion: '2.0' }
        BillingConfig:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/config', Method: GET, PayloadFormatVersion: '2.0' }
        BillingEpisodes:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/episodes', Method: GET, PayloadFormatVersion: '2.0' }
        BillingRead:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/read', Method: POST, PayloadFormatVersion: '2.0' }
        BillingConsultationCharge:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/consultation-charge', Method: POST, PayloadFormatVersion: '2.0' }
        BillingFulfillmentRead:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/fulfillment/read', Method: POST, PayloadFormatVersion: '2.0' }
        BillingFulfillment:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/fulfillment', Method: POST, PayloadFormatVersion: '2.0' }
        BillingPayments:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/payments', Method: POST, PayloadFormatVersion: '2.0' }
        BillingReceipt:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/billing/receipt', Method: POST, PayloadFormatVersion: '2.0' }
        ConsultationQueue:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations', Method: GET, PayloadFormatVersion: '2.0' }
        PrescriptionHandoffQueue:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/prescriptions', Method: GET, PayloadFormatVersion: '2.0' }
        PrescriptionHandoffRead:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/prescriptions/read', Method: POST, PayloadFormatVersion: '2.0' }
        PrescriptionEmailPreview:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/prescriptions/email/preview', Method: POST, PayloadFormatVersion: '2.0' }
        PrescriptionEmailSend:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/prescriptions/email', Method: POST, PayloadFormatVersion: '2.0' }
        ConsultationRead:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/read', Method: POST, PayloadFormatVersion: '2.0' }
        PatientHistoryList:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/history/list', Method: POST, PayloadFormatVersion: '2.0' }
        PatientHistoryDetail:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/history/detail', Method: POST, PayloadFormatVersion: '2.0' }
        SearchMedicines:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/medicines/search', Method: POST, PayloadFormatVersion: '2.0' }
        ConsultationVitals:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/vitals', Method: POST, PayloadFormatVersion: '2.0' }
        ConsultationDraft:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/draft', Method: POST, PayloadFormatVersion: '2.0' }
        ConsultationFinalize:
          Type: HttpApi
          Properties: { ApiId: !Ref WorkflowApi, Path: '/api/workflow/clinics/{slug}/consultations/finalize', Method: POST, PayloadFormatVersion: '2.0' }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [handler.ts]
        Format: cjs
        OutExtension: ['.js=.cjs']
        Target: es2022
        Minify: true
        Sourcemap: false

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clinicpluz-${StageName}-workflow
      RetentionInDays: 14

Outputs:
  ApiOrigin:
    Value: !Sub https://${WorkflowApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  ClinicalTableName:
    Value: !Ref ClinicalTable
  WorkflowEdgeSecretArn:
    Value: !Ref WorkflowEdgeSecret
    Description: Configure only as a CloudFront origin custom header for /api/workflow/*

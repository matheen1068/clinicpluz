AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClinicPluz synthetic staging Control Panel backend (no clinical records)

Parameters:
  StageName:
    Type: String
    Default: staging
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
  PublicOrigin:
    Type: String
    Description: Exact Control Panel CloudFront HTTPS origin
    AllowedPattern: 'https://[a-z0-9-]+\.cloudfront\.net'
  AuthTableName:
    Type: String
    Description: AuthTableName output from the clinic-auth-aws stack
  StaffUserPoolId:
    Type: String
    Description: UserPoolId output from the clinic-auth-aws stack
  StaffUserPoolArn:
    Type: String
    Description: ARN of the same clinic staff user pool
  AllowedOperatorSubs:
    Type: String
    Description: Comma-separated Cognito sub UUIDs for up to five separately provisioned platform operators
    Default: '00000000-0000-0000-0000-000000000000' # Deny all until an operator is created and this parameter is updated.
    MaxLength: 184
    AllowedPattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,4}'
  CursorSigningKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret for binding directory pagination cursors to their filter and scope

Resources:
  OperatorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub clinicpluz-${StageName}-operators
      UserPoolTier: ESSENTIALS
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  OperatorPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OperatorUserPool
      ClientName: !Sub clinicpluz-${StageName}-operators-client
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      CallbackURLs: [!Sub '${PublicOrigin}/control/callback']
      LogoutURLs: [!Sub '${PublicOrigin}/control/']
      SupportedIdentityProviders: [COGNITO]

  OperatorPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub clinicpluz-${AWS::AccountId}-${StageName}-operators
      UserPoolId: !Ref OperatorUserPool
      ManagedLoginVersion: 2

  OperatorLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: OperatorPoolDomain
    Properties:
      UserPoolId: !Ref OperatorUserPool
      ClientId: !Ref OperatorPoolClient
      UseCognitoProvidedValues: true

  ControlApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: OperatorJwt
        Authorizers:
          OperatorJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${OperatorUserPool}
              audience: [!Ref OperatorPoolClient]

  ControlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clinicpluz-${StageName}-control-panel-api
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          AUTH_TABLE: !Ref AuthTableName
          STAFF_USER_POOL_ID: !Ref StaffUserPoolId
          PUBLIC_ORIGIN: !Ref PublicOrigin
          OPERATOR_ISSUER: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${OperatorUserPool}
          OPERATOR_CLIENT_ID: !Ref OperatorPoolClient
          ALLOWED_OPERATOR_SUBS: !Ref AllowedOperatorSubs
          CURSOR_SIGNING_KEY: !Ref CursorSigningKey
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:Query']
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthTableName}
              Condition:
                'ForAllValues:StringLike':
                  'dynamodb:LeadingKeys': ['CLINIC#*', 'CUSTOMER#*', 'CONTROL#CUSTOMERS', 'CONTROL#BRANCHES']
                'Null':
                  'dynamodb:LeadingKeys': 'false'
            - Effect: Allow
              Action: ['dynamodb:ConditionCheckItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem']
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthTableName}
              Condition:
                'ForAllValues:StringLike':
                  'dynamodb:LeadingKeys': ['CLINIC#*', 'CUSTOMER#*', 'CONTROL#CUSTOMERS', 'CONTROL#BRANCHES', 'AUDIT#*']
                'Null':
                  'dynamodb:LeadingKeys': 'false'
            - Effect: Allow
              Action: ['cognito-idp:AdminGetUser']
              Resource: !Ref StaffUserPoolArn
      Events:
        CreateCustomer:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers', Method: POST, PayloadFormatVersion: '2.0' }
        ListCustomers:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers', Method: GET, PayloadFormatVersion: '2.0' }
        GetCustomer:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers/{customerId}', Method: GET, PayloadFormatVersion: '2.0' }
        CreateBranch:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers/{customerId}/branches', Method: POST, PayloadFormatVersion: '2.0' }
        AdoptLegacyBranch:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers/{customerId}/branches/adopt', Method: POST, PayloadFormatVersion: '2.0' }
        ListCustomerBranches:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers/{customerId}/branches', Method: GET, PayloadFormatVersion: '2.0' }
        GetCustomerBranch:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/customers/{customerId}/branches/{slug}', Method: GET, PayloadFormatVersion: '2.0' }
        ListBranches:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/branches', Method: GET, PayloadFormatVersion: '2.0' }
        GetBranch:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/branches/{slug}', Method: GET, PayloadFormatVersion: '2.0' }
        GetClinic:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}', Method: GET, PayloadFormatVersion: '2.0' }
        SetState:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}/state', Method: PATCH, PayloadFormatVersion: '2.0' }
        SetModules:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}/modules', Method: PUT, PayloadFormatVersion: '2.0' }
        CreateStaff:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}/staff', Method: POST, PayloadFormatVersion: '2.0' }
        ListStaff:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}/staff', Method: GET, PayloadFormatVersion: '2.0' }
        GetStaff:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}/staff/{username}', Method: GET, PayloadFormatVersion: '2.0' }
        SetStaff:
          Type: HttpApi
          Properties: { ApiId: !Ref ControlApi, Path: '/api/control/clinics/{slug}/staff/{username}', Method: PATCH, PayloadFormatVersion: '2.0' }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [handler.ts]
        # Keep bundled AWS SDK CommonJS requires compatible with Node built-ins.
        Format: cjs
        OutExtension: ['.js=.cjs']
        Target: es2022
        Minify: true
        Sourcemap: false

  ControlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clinicpluz-${StageName}-control-panel-api
      RetentionInDays: 14

Outputs:
  ApiOrigin:
    Value: !Sub https://${ControlApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
    Description: Route Control Panel API through no-cache CloudFront behavior; protect the separate operator login UI.
  OperatorUserPoolId:
    Value: !Ref OperatorUserPool
  OperatorClientId:
    Value: !Ref OperatorPoolClient
  OperatorIssuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${OperatorUserPool}
  OperatorHostedDomain:
    Value: !Sub https://${OperatorPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  OperatorCallbackUrl:
    Value: !Sub '${PublicOrigin}/control/callback'
